<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coffee n Blog – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/admin.css" />
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header admin-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">
            <div class="brand-mark-inner">CnB</div>
          </div>
          <div class="brand-text">
            <h1>Admin</h1>
            <span>Manage posts and users</span>
          </div>
        </div>

        <div class="admin-topbar">
          <div class="admin-me" id="meLine"></div>
          <button class="pill-btn" id="logoutBtn" type="button" style="display:none">
            <span class="dot" style="background: var(--accent)"></span>
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <section class="side-card" id="loginCard">
        <div class="side-header">
          <h3>Login</h3>
          <span>Use your admin/editor account</span>
        </div>

        <form id="loginForm" class="admin-form">
          <label>
            <span class="label">Username</span>
            <input class="input" id="loginUsername" autocomplete="username" />
          </label>
          <label>
            <span class="label">Password</span>
            <input class="input" id="loginPassword" type="password" autocomplete="current-password" />
          </label>

          <div class="row">
            <button class="hero-cta" type="submit">Sign in</button>
            <div class="hint" id="loginHint"></div>
          </div>
        </form>
      </section>

      <section class="side-card" id="postsCard" style="display:none">
        <div class="side-header">
          <h3>Write / Edit Post</h3>
          <span id="postFormMode">New</span>
        </div>

        <form id="postForm" class="admin-form">
          <input type="hidden" id="postId" />

          <label>
            <span class="label">Title</span>
            <input class="input" id="postTitle" required />
          </label>

          <label>
            <span class="label">Category</span>
            <select class="input" id="postBucket">
              <option>Tech</option>
              <option>AI &amp; Future Tech</option>
              <option>Business &amp; Markets</option>
              <option>Personal Finance</option>
            </select>
          </label>

          <label>
            <span class="label">OpenGraph Image URL (optional)</span>
            <input class="input" id="postOgImg" placeholder="https://..." />
          </label>

          <label>
            <span class="label">Read minutes (optional)</span>
            <input class="input" id="postReadMinutes" type="number" min="1" />
          </label>

          <label>
            <span class="label">Excerpt (optional)</span>
            <textarea class="input textarea" id="postExcerpt" placeholder="If empty, excerpt is auto-generated"></textarea>
          </label>

          <label>
            <span class="label">Content (HTML allowed)</span>
            <textarea class="input textarea" id="postContent" required></textarea>
          </label>

          <div class="row">
            <button class="hero-cta" type="submit" id="savePostBtn">Save</button>
            <button class="pill-btn" type="button" id="newPostBtn">
              <span class="dot" style="background: #4cd4ff"></span>
              New
            </button>
            <button class="pill-btn danger" type="button" id="deletePostBtn" style="display:none">
              <span class="dot" style="background: var(--danger)"></span>
              Delete
            </button>
            <div class="hint" id="postHint"></div>
          </div>
        </form>
      </section>

      <section class="side-card" id="postsListCard" style="display:none">
        <div class="side-header">
          <h3>All Posts</h3>
          <span id="postsCount">0</span>
        </div>
        <div class="mini-list" id="postsList"></div>
      </section>

      <section class="side-card" id="usersCard" style="display:none">
        <div class="side-header">
          <h3>Users</h3>
          <span>Admins only</span>
        </div>

        <form id="userForm" class="admin-form">
          <label>
            <span class="label">New username</span>
            <input class="input" id="newUsername" autocomplete="off" />
          </label>
          <label>
            <span class="label">New password</span>
            <input class="input" id="newPassword" type="password" autocomplete="new-password" />
          </label>
          <label>
            <span class="label">Role</span>
            <select class="input" id="newRole">
              <option value="editor">editor</option>
              <option value="admin">admin</option>
            </select>
          </label>

          <div class="row">
            <button class="hero-cta" type="submit">Add user</button>
            <div class="hint" id="userHint"></div>
          </div>
        </form>

        <div class="mini-list" id="usersList"></div>
      </section>
    </main>

    <footer>
      <div>Admin panel for Coffee n Blog.</div>
      <div><a href="/">Go to site</a></div>
    </footer>
  </div>
</body>
</html>
