name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -r server/requirements.txt pytest
      - name: Run unit tests
        run: pytest tests/
        env:
          DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:9/none
