<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coffee n Blog – Post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Back to home">
        <div class="brand-mark">
          <div class="brand-mark-inner">CnB</div>
        </div>
        <div class="brand-text">
          <h1>Coffee n Blog</h1>
          <span>
            Latest News • Tech • Business • Finance
            <span class="live-pill">
              <span class="live-dot"></span> Live Feed
            </span>
          </span>
        </div>
      </a>

      <div class="search-group">
        <button class="pill-btn" id="themeToggle" type="button" aria-label="Toggle light mode">
          <span class="dot" style="background: var(--accent)"></span>
          <span id="themeToggleText">Light</span>
        </button>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <main>
      <section class="post-page" id="postPage">
        <div class="post-page-head">
          <a class="pill-btn" href="/">← Back</a>
          <div class="accent-line"></div>
        </div>

        <article class="post-page-card" aria-live="polite">
          <div class="post-page-meta" id="postMeta"></div>
          <h2 class="post-page-title" id="postTitle"></h2>
          <div class="post-page-content" id="postContent"></div>
        </article>

        <div class="empty-state" id="postError" style="display:none;"></div>
      </section>
    </main>

    <footer>
      <div>© <span id="year"></span> Coffee n Blog. All rights reserved.</div>
      <div>Static front-end built with HTML, CSS & JS.</div>
    </footer>
  </div>

  <script src="/static/post.js" defer></script>
</body>
</html>
